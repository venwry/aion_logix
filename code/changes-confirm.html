<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Changes confirm · Aion Logix</title><link rel="stylesheet" href="app.css"><link rel="icon" type="image/png" href="../assets/aion-favicon.png"><link rel="apple-touch-icon" href="../assets/aion-favicon.png"></head>
<body data-page="changes" data-backend-url="https://aion-review-zu1t.onrender.com">
<header class="app-header"><a class="brand" href="timeline.html"><img class="brand-logo" src="../assets/logix-aion.png" alt="Logix and AION — timeline" width="1219" height="270"></a><nav aria-label="Main navigation"><a href="timeline.html">Timeline</a><a href="browser.html">Data browser</a><a href="changes-confirm.html" aria-current="page">Changes confirm</a><a href="../docs/viewer.html">Documentation ↗</a></nav></header>
<div class="review-toolbar"><label>Show <select id="category"><option value="">All proposals</option><option value="story">Story changes</option><option value="schema">Schema extensions</option></select></label><label>Search <input type="search" id="search" placeholder="Record, title or description"></label><label>Review state <select id="review-state"><option value="">All review states</option><option value="pending">Pending review</option><option value="needs_refinement">Needs refinement</option></select></label><button type="button" id="save-review" class="quiet-button" disabled>Save</button><span id="feedback-count" role="status">0 uncommitted</span><span id="removal-count" role="status">0 removals</span><span id="selected-count" role="status">0 selected</span><span id="review-count" role="status">Loading proposals…</span></div>
