<!doctype html><html lang="pl"><meta charset="utf-8"><style>body{font-family:system-ui;padding:30px;color:#173b36}button{background:#175d50;color:white;border:0;padding:12px 20px;border-radius:8px;cursor:pointer}.year{font-size:70px;margin:25px 0}small{color:#60736b}</style><h1>Warsztat podróży w czasie</h1><p>Demonstracja interakcji JavaScript — nie jest to element kanonu historii.</p><div class="year" id="year">1970</div><button id="next">Następny rok</button> <button id="reset">Od początku</button><p><small>Samodzielny prototyp HTML/JS uruchomiony w odizolowanej ramce.</small></p><script>let year=1970;document.getElementById('next').onclick=()=>document.getElementById('year').textContent=++year;document.getElementById('reset').onclick=()=>{year=1970;document.getElementById('year').textContent=year};</script></html>
